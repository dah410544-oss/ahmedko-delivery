name: Build AHMEDKO Android test APK (manual only)
# Debug/test build only. Never treat this artifact as an official signed release.
# Deliberately manual-only to avoid repeated APK builds on every source change.

on:
  workflow_dispatch:

concurrency:
  group: ahmedko-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare web app and Android artwork
        run: |
          npm run build:web
          npm install --no-save --no-package-lock sharp
          mkdir -p assets
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp('icon.svg').resize(1024, 1024).png().toFile('assets/icon.png');
          const splashMark = await sharp('icon.svg').resize(1200, 1200).png().toBuffer();
          await sharp({
            create: {
              width: 2732,
              height: 2732,
              channels: 4,
              background: '#071A35'
            }
          }).composite([{ input: splashMark, gravity: 'centre' }]).png().toFile('assets/splash.png');
          NODE

      - name: Create Android project
        run: npx cap add android

      - name: Generate branded Android icons and splash assets
        run: npx capacitor-assets generate --android --iconBackgroundColor "#071A35" --splashBackgroundColor "#071A35"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable test APK
        uses: actions/upload-artifact@v7
        with:
          name: AHMEDKO-DELIVERY-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
