name: Validate AHMEDKO native Android foundation

on:
  push:
    branches: [feature/native-android-foundation]
    paths:
      - "native-android/**"
      - ".github/workflows/android-native-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-native-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK components
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # Java and Kotlin targets are both pinned to 17 in app/build.gradle.kts.
      - name: Assemble native Android debug APK
        run: gradle -p native-android :app:assembleDebug
      - name: Upload native preview APK
        uses: actions/upload-artifact@v4
        with:
          name: AHMEDKO-native-android-preview
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
