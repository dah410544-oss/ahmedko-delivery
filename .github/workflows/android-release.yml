name: Build AHMEDKO signed Android release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ahmedko-android-release
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret for ${name}. See ANDROID_RELEASE_SETUP.md."
              exit 1
            fi
          done

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare web app and Android artwork
        run: |
          npm run build:web
          npm install --no-save --no-package-lock sharp
          mkdir -p assets
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp('icon.svg').resize(1024, 1024).png().toFile('assets/icon.png');
          const mark = await sharp('icon.svg').resize(1200, 1200).png().toBuffer();
          await sharp({ create: { width: 2732, height: 2732, channels: 4, background: '#071A35' } })
            .composite([{ input: mark, gravity: 'centre' }]).png().toFile('assets/splash.png');
          NODE

      - name: Create and sync Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#071A35" --splashBackgroundColor "#071A35"
          npx cap sync android

      - name: Configure stable release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ahmedko-release.keystore"
          test -s "$RUNNER_TEMP/ahmedko-release.keystore"
          export KEYSTORE_PATH="$RUNNER_TEMP/ahmedko-release.keystore"
          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path("android/app/build.gradle")
          s = p.read_text()
          if s.count("buildTypes {") != 1 or not re.search(r"buildTypes\\s*\\{\\s*release\\s*\\{", s):
              raise SystemExit("Unexpected Android Gradle template; refusing to patch signing configuration.")
          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("AHMEDKO_KEYSTORE_PATH"))
                      storePassword System.getenv("AHMEDKO_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("AHMEDKO_KEY_ALIAS")
                      keyPassword System.getenv("AHMEDKO_KEY_PASSWORD")
                  }
              }
          """
          s = s.replace("android {", "android {\\n" + signing, 1)
          s, n = re.subn(r"(buildTypes\\s*\\{\\s*release\\s*\\{)", r"\\1\\n            signingConfig signingConfigs.release", s, count=1)
          if n != 1:
              raise SystemExit("Could not safely configure the release build type.")
          s, n = re.subn(r"(defaultConfig\\s*\\{)", r"\\1\\n        versionCode " + os.environ["BUILD_NUMBER"] + r"\\n        versionName \"1.0." + os.environ["BUILD_NUMBER"] + r"\"", s, count=1)
          if n != 1:
              raise SystemExit("Could not set Android release version.")
          p.write_text(s)
          PY
        env:
          AHMEDKO_KEYSTORE_PATH: ${{ runner.temp }}/ahmedko-release.keystore
          AHMEDKO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AHMEDKO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AHMEDKO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed APK and Play Store AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          jarsigner -verify -verbose -certs app/build/outputs/apk/release/app-release.apk >/dev/null
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: AHMEDKO-DELIVERY-signed-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
